<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>Multi-step Register Form | devChallenges.io</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="esticides.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <!-- STEP 1 CARD -->
      <article class="card step-1">
        <h1>Register</h1>

        <form class="contact-form">
          <label for="name">Name</label>
          <input 
            type="text" 
            name="username" 
            placeholder="Enter your name"
            class="for-name"
          />

          <label for="email">Email</label>
          <input
            type="text" 
            name="email" 
            placeholder="Example@gmail.com"
            required="erro"
          />
        </form>

        <div class="btn">
          <button>Continue</button>
        </div>

      </article>

      <footer class="steps">
        <p>Step 1 of 3</p>
        <div class="next-dots">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </footer>

      <!-- STEP 2 CARD -->
      <article class="card step-2">

        <h2>What topics are you interested in?</h2>
        <form class="checkbox-form">
          <input 
            type="checkbox" 
            name="topics" 
            id="software development"
          />

          <input 
            type="checkbox" 
            name="topics" 
            id="user experience"
          />

          <input 
            type="checkbox" 
            name="topics" 
            id="software development"
          />
        </form>
        
        <div class="btn">
          <button>Continue</button>
        </div>
      </article>

    </main>

  </body>
</html>
