<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>Multi-step Register Form | devChallenges.io</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="esticide.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <!-- STEP 1 CARD -->
      <article class="card step-1">
        <h1>Register</h1>

        <form class="contact-form">
          <label for="name">Name</label>
          <input 
            type="text"
            id="name"
            name="username" 
            placeholder="Enter your name"
            class="for-name"
            required
          />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="user-email" 
            placeholder="Example@gmail.com"
            required
          />
        </form>

        <div class="btn">
          <button>Continue</button>
        </div>

      </article>

      <footer class="steps">
        <p>Step 1 of 3</p>
        <div class="next-dots">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </footer>

      <!-- STEP 2 CARD -->
      <article class="card step-2">

        <h2>What topics are you interested in?</h2>
        <form class="checkbox-form">
          <input
            type="checkbox" 
            name="topics" 
            id="software-development"
          />
          <label for="software-development">Software Development</label>

          
          <input
            type="checkbox" 
            name="topics" 
            id="user-experience"
          />
          <label for="user-experience">User Experience</label>


          <input 
            type="checkbox" 
            name="topics" 
            id="graphic-design"
          />
          <label for="graphic-design">Graphic Design</label>

        </form>

        <div class="btn">
          <button>Continue</button>
        </div>
      </article>
      
      <article class="card step-3" hidden>
        <h3>Summary</h3>

        <div class="summary">
          <p>Name:<span id="display-name"></span></p>
          <p>Email:<span id="display-email"></span></p>
          <p>Topics:</p>
          <ul class="display-topics">
            
          </ul>
        </div>
      </article>

    </main>

  </body>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
  eruda.init();
</script>
</html>
